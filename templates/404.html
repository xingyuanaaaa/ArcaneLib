<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08080f">
    <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">
    <title>404 - 页面未找到 - {{ site_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
            background: #08080f;
            color: #e0ddd5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -3;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(124, 58, 237, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(201, 160, 80, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(20, 184, 166, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(155, 44, 44, 0.04) 0%, transparent 40%);
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2;
            pointer-events: none;
            opacity: 0.03;
            background-image:
                radial-gradient(circle at 15% 25%, #c9a050 1px, transparent 1px),
                radial-gradient(circle at 85% 35%, #7c3aed 1px, transparent 1px),
                radial-gradient(circle at 35% 75%, #14b8a6 1px, transparent 1px),
                radial-gradient(circle at 65% 55%, #c9a050 1px, transparent 1px);
            background-size: 120px 120px, 160px 160px, 140px 140px, 100px 100px;
        }
        .error-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 48px 32px;
            max-width: 440px;
            width: 90%;
            background: rgba(18, 18, 35, 0.75);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(201, 160, 80, 0.12);
            border-radius: 20px;
        }
        .error-container::before {
            content: '';
            position: absolute;
            top: -1px; left: 20px; right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201, 160, 80, 0.3), transparent);
        }
        .error-container::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 20px; right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.2), transparent);
        }
        .arcane-sigil {
            display: inline-block;
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            position: relative;
        }
        .arcane-sigil::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid rgba(201, 160, 80, 0.15);
            border-radius: 50%;
            animation: sigilPulse 3s ease-in-out infinite;
        }
        .arcane-sigil::after {
            content: '◆';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: rgba(201, 160, 80, 0.35);
        }
        @keyframes sigilPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        .error-code {
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(180deg, #c9a050 0%, #8b6d30 40%, #c9a050 70%, #5c5848 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            line-height: 1;
            margin-bottom: 4px;
        }
        .error-title {
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #d4b868;
            margin-bottom: 16px;
        }
        .error-desc {
            font-size: 0.88rem;
            color: #9c9788;
            line-height: 1.8;
            margin-bottom: 6px;
        }
        .error-desc-sub {
            font-size: 0.78rem;
            color: #5c5848;
            font-style: italic;
            margin-bottom: 28px;
        }
        .divider {
            width: 50px;
            height: 1px;
            margin: 0 auto 24px;
            background: linear-gradient(90deg, transparent, rgba(201, 160, 80, 0.4), transparent);
        }
        .divider::after {
            content: '◆';
            display: block;
            text-align: center;
            font-size: 0.4rem;
            color: rgba(201, 160, 80, 0.5);
            margin-top: -3px;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 36px;
            border-radius: 18px;
            font-size: 0.88rem;
            font-weight: 600;
            font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
            letter-spacing: 1px;
            text-decoration: none;
            color: #c9a050;
            background: linear-gradient(135deg, rgba(201, 160, 80, 0.12), rgba(124, 58, 237, 0.06));
            border: 1px solid rgba(201, 160, 80, 0.25);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-home:hover {
            background: rgba(201, 160, 80, 0.18);
            box-shadow: 0 0 24px rgba(201, 160, 80, 0.25);
            border-color: rgba(201, 160, 80, 0.45);
        }
        .btn-home:active {
            transform: scale(0.96);
        }
        .void-particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
        }
        .void-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(201, 160, 80, 0.4);
            border-radius: 50%;
            animation: voidFloat 6s ease-in-out infinite;
        }
        .void-particle:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; animation-duration: 5s; }
        .void-particle:nth-child(2) { left: 75%; top: 30%; animation-delay: 1.2s; animation-duration: 7s; }
        .void-particle:nth-child(3) { left: 40%; top: 70%; animation-delay: 2.5s; animation-duration: 6s; }
        .void-particle:nth-child(4) { left: 85%; top: 65%; animation-delay: 3.8s; animation-duration: 8s; }
        .void-particle:nth-child(5) { left: 25%; top: 50%; animation-delay: 0.8s; animation-duration: 6.5s; }
        .void-particle:nth-child(6) { left: 60%; top: 15%; animation-delay: 4.2s; animation-duration: 5.5s; }
        @keyframes voidFloat {
            0%, 100% { opacity: 0; transform: translateY(0) scale(1); }
            20% { opacity: 0.8; }
            50% { opacity: 0.3; transform: translateY(-30px) scale(1.5); }
            80% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="void-particles">
        <div class="void-particle"></div>
        <div class="void-particle"></div>
        <div class="void-particle"></div>
        <div class="void-particle"></div>
        <div class="void-particle"></div>
        <div class="void-particle"></div>
    </div>

    <div class="error-container">
        <div class="arcane-sigil"></div>
        <div class="error-code">404</div>
        <div class="error-title">此页面已被虚空吞噬</div>
        <div class="error-desc">你所追寻的知识已消散于奥术裂隙之中</div>
        <div class="error-desc-sub">页面不存在或已被移除</div>
        <div class="divider"></div>
        <a href="{{ url_for('main.index') }}" class="btn-home">返回首页</a>
    </div>
</body>
</html>
